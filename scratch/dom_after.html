  --color-shadow: rgba(90, 45, 55, 0.12); /* Soft neutral shadow */

  /* Deep Atmospheric Wine/Plum Canvas Underlay */

  /* Legacy Variable Aliases mapped directly to New Pastel Theme */
  --gold-primary: var(--color-primary);
  --gold-warm: var(--color-primary);
  --gold-rich: var(--color-border);
  --gold-accent: var(--color-secondary);
  --rose-soft: var(--color-secondary);
  --rose-glow: var(--color-primary);
  --lavender: var(--color-secondary);
  --border-glow: var(--color-border-subtle);

  --shadow-cinematic: 0 25px 60px -15px rgba(35, 12, 22, 0.75);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;

#root {

.btn-cinematic {

.btn-cinematic:disabled {

  transform: none;
  box-shadow: none;
}

.btn-ghost:active {

}

.btn-ghost:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 3px;
}

.btn-ghost:disabled {

  cursor: not-allowed;

}

@keyframes pulseGlow {

    background-position: 200% center;
  }

/* Ambient Background Canvas Layer */
.ambient-canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 0;
}

/* Active Stage Viewport Wrapper */
.stage-container {

@keyframes fadeInStage {
  from {

  to {

    transform: scale3d(1, 1, 1) translate3d(0, 0, 0);

/* Subtle Cursor Glow (Desktop only) */
.cursor-ambient-aura {

/* Media Query Responsiveness */

/* Reduced Motion Support */
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
